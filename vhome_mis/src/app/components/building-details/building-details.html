@if(buildingService.ready()){
  <div class="building-grid">
    <mat-card class="building-card clickable-card">
      <div class="header-container">
        <mat-card-header>
          <mat-card-title>{{ buildingData().name }}</mat-card-title>
          <mat-card-subtitle>地址:{{ buildingData().address }}</mat-card-subtitle>
        </mat-card-header>
      </div>
  
      <mat-card-content class="card-workspace" (click)="$event.stopPropagation()">
        <p class="preview-label">樓層:</p>
        <div class="floor-rows">
          @for (floor of buildingData().building_floors; track $index) {
            <span
              class="floor-chip"
              [routerLink]="['floor', floor.ID]"
            >
              {{ floor.floor_name }}
            </span>
          } @empty {
            <span class="empty-state-text">此建築尚無登記之樓層.</span>
          }
        </div>
      </mat-card-content>
    </mat-card>
  </div>
}
