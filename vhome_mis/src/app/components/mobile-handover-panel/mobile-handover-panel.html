<div class="mobile-feed-container">
  <!-- 1. Sticky Top Navigation & Actions -->
  <mat-toolbar color="primary" class="mobile-header">
    <span class="title">交班訊息</span>
    <span class="spacer"></span>

    <button
      mat-icon-button
      class="header-button"
      aria-label="Refresh feed"
      (click)="summonNewMessageDialog()"
    >
      <mat-icon>add</mat-icon>
    </button>
    <!-- Refresh Button moved to Header to avoid FAB clutter -->
    <button
      mat-icon-button
      class="header-button"
      aria-label="Refresh feed"
      (click)="store.refresh()"
    >
      <mat-icon>refresh</mat-icon>
    </button>
  </mat-toolbar>

  <!-- 3. Virtual Scrolling Card Feed -->
  <cdk-virtual-scroll-viewport
    [itemSize]="ITEM_SIZE_PX"
    minBufferPx="240"
    maxBufferPx="480"
    (scrolledIndexChange)="onScrollIndexChange()"
    class="feed-viewport"
  >
    <!-- Initial Loading State -->
    @if (store.isLoadingInitial()) {
      <div class="center-spinner">
        <mat-spinner diameter="40" />
        <p>訊息讀取中...</p>
      </div>
    }

    <!-- Inline Debug Card Item -->
    <app-handover-card
      *cdkVirtualFor="let card of store.handovers(); trackBy: trackById"
      [card]="card"
      [highlightText]="highlightText"
    />

    <!-- Bottom Infinite Scroll Loading State -->
    @if (store.isLoadingMore()) {
      <div class="loading-more-spinner">
        <mat-spinner diameter="24" />
        <span>訊息讀取中...</span>
      </div>
    }
  </cdk-virtual-scroll-viewport>

  <!-- 4. Primary Floating Action Button (Add Message) -->
  <!-- <button mat-fab color="primary" class="create-message-fab" aria-label="Add new handover message">
    <mat-icon>add</mat-icon>
  </button> -->
</div>
