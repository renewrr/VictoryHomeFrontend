<!-- login-mobile.component.html -->
<div class="mobile-login-wrapper">
  <!-- Mobile Brand Header -->
  <div class="brand-header">
    <img class="app-logo" src="vhome_logo.png" />
  </div>

  <!-- Mobile Form Body -->
  <form [formGroup]="loginForm" class="mobile-form">
    <div class="form-fields">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>帳號</mat-label>
        <input matInput formControlName="account" placeholder="Ex. vh00" />
        @if (loginForm.hasError('required')) {
          <mat-error>請輸入帳號</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>密碼</mat-label>
        <input
          matInput
          type="password"
          formControlName="password"
          [errorStateMatcher]="matcher"
          placeholder="8字元以上英文數字"
        />
        @if (loginForm.hasError('required')) {
          <mat-error>請輸入密碼</mat-error>
        }
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>兩步驟驗證</mat-label>
        <input
          matInput
          formControlName="totp"
          [errorStateMatcher]="matcher"
          placeholder="Authenticator app 中 6字數字"
        />
        @if (loginForm.hasError('required')) {
          <mat-error>請輸入驗證碼</mat-error>
        }
      </mat-form-field>
    </div>

    <!-- Sticky Bottom Submit Button -->
    <div class="bottom-action-bar">
      <button
        matButton="filled"
        (click)="onSubmit()"
        class="mobile-submit-btn"
        [disabled]="loginForm.invalid"
        color="primary"
      >
        @if (isLoading()) {
          <mat-spinner [diameter]="20" class="login-spinner" color="accent"></mat-spinner>
        } @else {
          <span>登入</span>
        }
      </button>
    </div>
  </form>
</div>
