<!-- features/profile/change-password-dialog/change-password-dialog.component.html -->
<h2 mat-dialog-title>更新密碼</h2>

<mat-dialog-content [formGroup]="passwordForm" class="pt-2">
  <p class="text-secondary text-sm mb-4">請輸入舊密碼以驗證此次更新</p>

  @if (errorMessage()) {
    <div class="bg-red-50 text-red-600 p-3 rounded mb-4 text-sm border border-red-200">
      {{ errorMessage() }}
    </div>
  }

  <!-- Current Password Field -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>舊密碼</mat-label>
    <input [type]="hideCurrent() ? 'password' : 'text'" matInput formControlName="currentPassword">
    <button mat-icon-button matSuffix (click)="hideCurrent.set(!hideCurrent())" type="button">
      <mat-icon>{{ hideCurrent() ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
  </mat-form-field>

  <!-- New Password Field -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>新密碼</mat-label>
    <input [type]="hideNew() ? 'password' : 'text'" matInput formControlName="newPassword">
    <button mat-icon-button matSuffix (click)="hideNew.set(!hideNew())" type="button">
      <mat-icon>{{ hideNew() ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
    @if (passwordForm.get('newPassword')?.hasError('minlength')) {
      <mat-error>Password must be at least 8 characters.</mat-error>
    }
  </mat-form-field>

  <!-- Confirm Password Field -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>再次輸入新密碼</mat-label>
    <input type="password" matInput formControlName="confirmPassword">
    @if (passwordForm.hasError('passwordsMismatch') && passwordForm.get('confirmPassword')?.touched) {
      <mat-error>新密碼兩次輸入不符。</mat-error>
    }
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [disabled]="isSubmitting()">取消</button>
  <button mat-flat-button color="primary" 
          [disabled]="passwordForm.invalid || isSubmitting()" 
          (click)="onSave()">
    {{ isSubmitting() ? '傳送中...' : '送出' }}
  </button>
</mat-dialog-actions>
