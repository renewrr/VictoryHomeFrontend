<h2 mat-dialog-title>安全性驗證</h2>

<mat-dialog-content>
  <p>請輸入authenticator app中之六位數驗證碼</p>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>二次驗證碼</mat-label>
    <input
      matInput
      [(ngModel)]="verificationCode"
      maxLength="6"
      placeholder="000000"
      autocomplete="one-time-code"
    />
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">取消</button>

  <button
    mat-flat-button
    color="primary"
    [disabled]="verificationCode().length !== 6"
    (click)="onVerify()"
  >
    驗證
  </button>
</mat-dialog-actions>
