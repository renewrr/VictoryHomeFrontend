<div class="login-page">
  @if (layoutService.isMobile()) {
    <app-mobile-login-panel
      [isLoading]="isLoading()"
      [errorMessage]="errorMessage()"
      (loginSubmit)="onLoginAttempt($event)"
    />
  } @else {
    <div class="main-panel">
      <img class="vhome-logo" src="vhome_logo.png" />
      <app-login-panel-v2
        [isLoading]="isLoading()"
        [errorMessage]="errorMessage()"
        (loginSubmit)="onLoginAttempt($event)"
      />
    </div>
  }
</div>
