@if (pageContext.hideSidenav()) {
  <router-outlet />
} @else {
  <app-top-toolbar (toggleSidenav)="toggleSidenav()" />
  <mat-sidenav-container>
    <mat-sidenav [opened]="isSidenavOpen()" mode="side">
      <app-sidenav (toggleCollapse)="toggleSidenav()" />
    </mat-sidenav>
    <mat-sidenav-content>
      <router-outlet />
    </mat-sidenav-content>
  </mat-sidenav-container>
}
