@if (pageContext.hideSidenav()) {
  <router-outlet />
} @else {
  <app-top-toolbar (toggleSidenav)="toggleSidenav()" />
  <mat-sidenav-container>
    <mat-sidenav
      [opened]="isSidenavOpen()"
      mode="side"
      (openedStart)="onAnimationStart()"
      (closedStart)="onAnimationStart()"
      (openedChange)="onAnimationEnd()"
      class="app-sidenav"
    >
      <app-sidenav (toggleCollapse)="toggleSidenav()" />
    </mat-sidenav>
    <mat-sidenav-content class="main-content" [class.is-animating]="isAnimating()">
      <router-outlet />
    </mat-sidenav-content>
  </mat-sidenav-container>
}
